[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proctoriq-rag"
version = "0.1.0"
description = "RAG pipeline for the ProctorIQ assessment-support knowledge base, with a local measurement harness."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only the diagnostic script and the groundedness proxy need a local embedding model.
# Nothing in the core package imports sentence-transformers.
embed = ["sentence-transformers>=2.2"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -m 'not slow'"
markers = [
    "slow: opt-in tests that load models or execute the notebook (run with -m slow)",
]
