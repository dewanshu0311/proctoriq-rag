# ProctorIQ RAG — default configuration.
#
# NOTE ON WHAT IS DELIBERATELY ABSENT: there is no path to the answer key here.
# The answer key is a holdout test set. Nothing under src/ may know it exists —
# only scripts/ and tests/ name it. See tests/test_no_key_leakage.py.

paths:
  kb_dir: data/raw/kb
  test_csv: data/raw/test.csv
  sample_submission: data/raw/sample_submission.csv
  submission_out: outputs/submission.csv

submission:
  # ══ RESOLVED BY LEADERBOARD PROBE — do not change without a new probe ══
  #
  # Grader model, consistent with all four probe deltas:
  #   EXACT string match on each citation element, F1-style partial credit
  #   across the set.
  #
  # D-004 RESOLVED (probe 2): no .md extension. Adding it cost 15.66 points,
  # which is exactly the retrieval dimension (20 x doc_F1 0.783) — citation was
  # already zero in that run because it used full_header.
  doc_extension: false

  # D-005 RESOLVED (probes 3 and 4): number_only. Switching from full_header
  # gained +11.25 = 15 x citation_F1 0.750. title_only scored IDENTICALLY to
  # full_header (68.02 both) — the signature of exact matching, since both are
  # wrong strings and both score zero.
  # sample_submission.csv was authoritative after all, not dummy data.
  section_format: number_only

  separator: "|"

retrieval:
  # ── Phase 1 defaults. Still a plateau choice, but now leaderboard-validated
  # as part of the 79.27 configuration. ──────────────────────────────────────
  # 217 of 312 retrieval configurations are within one noise band of the top
  # recall@10 score on n=50, and 36 tie at it exactly. Nothing here was chosen
  # because it "won"; these are defaults picked from the broadest plateau so
  # Phase 2 has somewhere to start. Revisit once a reranker exists — a config
  # selected for pool quality is not necessarily the one to keep afterwards.
  #
  # See docs/DECISIONS.md D-011..D-016.
  chunker: section          # section | recursive | subsection
  chunk_size: null          # only used when chunker == recursive
  include_header_in_text: true
  model: sentence-transformers/all-MiniLM-L6-v2
  mode: hybrid              # dense | sparse | hybrid
  alpha: 0.7                # hybrid weight on dense; 1.0 = pure dense
  aggregator: max           # max | sum
  top_n: 15

  # ── DELIBERATELY UNSET ──────────────────────────────────────────────────
  # Citation cardinality is not decided in Phase 1. 36 of 50 questions want one
  # citation and 14 want two; no fixed rule serves both tails, so this belongs
  # to the router. The full curve is in outputs/sweep_retrieval_latest.csv.
  citation_strategy: null

rerank:
  # ── All 24 configurations were inside the +/-14.0 pp noise band; chosen on
  # tie-break. Now leaderboard-validated as part of the 79.27 configuration. ──
  # Chosen on tie-break, not on score: smallest model (~90 MB) and 5x faster than
  # the alternatives (19.1 pairs/s vs 3.9 bge-reranker-base, 2.9 mxbai) while
  # sitting top of both leaderboards. See docs/DECISIONS.md D-018..D-021.
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  text_variant: body        # body | titled  (measured: no effect, D-020)
  score_transform: auto     # sigmoid only when output is not already in [0,1] (D-021)

  # Exhaustive scoring of all 53 sections tied pooled EXACTLY (delta 0.0000).
  # Preferred for having fewer parts, not for scoring better. The Phase 1
  # retriever is retained; this sets the default path only. See D-019.
  pool_size: null           # null = score every section

  # D-025 RESOLVED (probe 5): the grader gives F1-style partial credit, not
  # exact-set matching. Blanket topk-2 cost only 2.37 points (predicted -3.4
  # under F1, -12.8 under exact) — so cardinality is worth a few points, not the
  # ~31 that exact-set matching would have implied.
  # topk-1 stays the default; the router raises cardinality per question where
  # intent says two sources are genuinely needed (D-022).
  citation_strategy: topk-1

routing:
  # ══ The router ships for REFUSALS ONLY. Both retrieval-side uses measured
  #    negative or neutral and are disabled. ═══════════════════════════════
  #
  # Classification accuracy vs the key:
  #   intent 84%  platform 87.5%  phase 93.5%  cardinality 74%
  enabled: true
  model: llama-3.1-8b-instant
  temperature: 0.0

  # ── MEASURED NEGATIVE #1: score biasing ─────────────────────────────────
  # Boosting platform / phase / policy documents, on the real 20/15 weighting
  # out of 35:
  #     router OFF                 26.93
  #     bias, topk-1               25.53   (-1.40)
  #     filter, topk-1             25.53   (-1.40)
  # By kind it gained EXACTLY 0.0000 on adversarial — the class it was built
  # for — and regressed lookup from 1.0000 to 0.9655. This falsifies the
  # retrieval-side half of the Phase 2 hypothesis. Kept as evidence, not
  # shipped. See D-034.
  score_bias: off           # off | bias | filter

  # ── MEASURED NEGATIVE #2: cardinality routing ───────────────────────────
  # Narrow (LLM-only) cardinality scored 26.88 vs 26.93 off — neutral. Widening
  # compound to raise recall took 1/14 -> 7/14 but added 5 false positives and
  # dropped the citation half to 26.50, BELOW router-off: a false positive
  # always adds a wrong citation, while a true positive only pays when the
  # second-ranked section is also right. See D-035.
  #
  # CORRECTION: an earlier version of this comment blamed the +0.23-vs--0.05
  # difference on router nondeterminism. That was WRONG. The router is fully
  # deterministic here — 5 runs at temperature 0 with the cache disabled gave
  # 50/50 stability on every axis and identical refusal firing [19,19,19,19,19].
  # The two figures came from two different PROMPT versions. Conclusion
  # unchanged, stated reason retracted. See D-036.
  cardinality_routing: false

  # ── WHAT THE ROUTER IS ACTUALLY FOR ─────────────────────────────────────
  # Refusal firing. Intent is widened toward `compound` deliberately: missing a
  # refusal costs integrity-refusal (15%) outright, while refusing-and-answering
  # a compound question costs little. That asymmetry runs the OPPOSITE way for
  # citations, which is why intent and cardinality are decoupled.
  refusal_firing: true

generation:
  # Extractive is the default and carries the probe submissions. It beat every
  # generated template on the groundedness proxy (0.7782 vs 0.7102 best generated),
  # is 80x faster, and is deterministic — which the probe design structurally
  # requires. See docs/DECISIONS.md D-026, D-027.
  mode: extractive          # extractive | generative

  # answer_from=top1 keeps answer_text identical when only the citation
  # configuration changes, which is what makes probe 5 a clean citation-only
  # experiment. Cost: 6 multi-source questions answer from one section. See D-028.
  answer_from: top1         # top1 | cited
  max_answer_chars: 700

  # Used only when mode=generative. structured-steps scored highest among the
  # three templates; answer-first-explained was designed for adversarial questions
  # and came last on them (D-026).
  template: structured-steps
  groq_model: llama-3.1-8b-instant
  temperature: 0.0
  rotate_keys: false        # single key by default (D-031)

embedding:
  # Local, offline, no API key. Used by scripts/diagnose_sections.py and by the
  # groundedness proxy in evaluation/scorer.py.
  #
  # The grader's own embedding model is UNKNOWN. See docs/DECISIONS.md — our
  # groundedness numbers are comparable to each other, not to the real score.
  diagnostic_model: sentence-transformers/all-MiniLM-L6-v2
