      obscure, or interfere with the camera, microphone, or face‑verification system. All
      of these actions are prohibited regardless of intent, so you should simply avoid them
      and keep your focus solely on the assessment window on the authorized device.
  Q25:
    answer: A warning that is only logged is recorded for later review but does not end your
