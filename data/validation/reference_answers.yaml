  Q22:
    answer: 'You are likely being flagged because the system is detecting one of the common
      issues: your face may be partially out of the frame, a bright light source behind you
      may be causing back‑lighting, another face may be visible, or something (a sticky note,
      camera cover, hand, etc.) could be obstructing the lens. Make sure your entire face
      stays visible, face a light source rather than having it behind you, be the only person
      in view, and keep the camera lens clear.'
  Q23:
    answer: The warning was triggered because the system detected multiple faces in the camera
      view. When your roommate walked past, a second face appeared, violating the “multiple
