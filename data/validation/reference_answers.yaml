  Q01:
    answer: First uninstall PSB completely via Control Panel → Programs and then restart your
      laptop. Next, download a fresh copy of the installer (do not reuse the old file) and
      run the installation as Administrator. After the install finishes, restart the laptop
      again before opening PSB.
  Q02:
    answer: Temporarily disable any third‑party antivirus or firewall software (Windows Defender
      is compatible) and verify that your internet connection works outside of PSB. Then reopen
      PSB and try to log in again; if the error appears twice, restart your laptop before
      attempting a third login.
  Q03:
    answer: Close PSB completely (verify in Task Manager that no PSB process remains), then
      restart your laptop. After the restart, reopen PSB and try the mock test again before
      your exam slot. If the “Unspecified Error” appears again after this restart, you must
      contact Support with your device logs and avoid retrying more than three times.
  Q04:
    answer: Close all browser windows, then reopen PSB using the desktop shortcut and log
      in with the credentials from your assessment‑invite email, avoiding any saved browser
      passwords. PSB requires a full account login through its native window and will not
      accept login attempts from an incognito browser tab.
  Q05:
    answer: The “Element not found” error on macOS means that one or more required permissions—Camera,
      Microphone, Screen Recording, and Accessibility—have not been granted. Open System Settings
      → Privacy & Security, verify that all four permissions are toggled on for PSB, then
      quit and relaunch PSB so the changes take effect.
  Q06:
    answer: No, you do not need a separate installer for an M‑series MacBook. PSB uses the
      same .dmg file for both Intel and Apple Silicon Macs, automatically detecting your architecture.
      The first launch on an M‑series Mac may be unusually slow because of Gatekeeper verification,
      but subsequent launches run faster.
  Q07:
    answer: If the OTP has not arrived after two minutes, verify that the contact details
