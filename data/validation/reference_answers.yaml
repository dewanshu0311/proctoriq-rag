      Windows or Mac installation guide. If the webcam still isn’t detected, try connecting
      it to a different USB port.
  Q10:
    answer: Sit facing a light source such as a window or lamp so the light illuminates your
      face rather than coming from behind you. Avoid strong backlighting, which can turn your
      face into a silhouette, and remove any sunglasses, hats, or other items that obscure
      your face during the verification capture. Adjusting the lighting and removing obstructions
      will make your face clearly visible for the mock test.
  Q11:
    answer: If the mock test network check reports “Unstable,” move closer to your Wi‑Fi router
      and close any bandwidth‑heavy applications such as streaming services or large downloads.
      If the instability continues, switch to a wired Ethernet connection for your actual
      assessment. A wired connection is the most reliable option where available.
  Q12:
    answer: You should complete your mock test at least 24 hours before your scheduled assessment
      window. Although this is not a hard technical requirement, it is the single most effective
      way to avoid last‑minute issues.
  Q13:
    answer: On Windows, an “Element not found” error means a required component failed to
      register, so you must uninstall PSB via Control Panel, restart the laptop, download
