# ProctorIQ RAG Challenge — hand-built validation key
#
# PURPOSE: this is a HOLDOUT TEST SET. It exists to measure the pipeline.
# It must NEVER be imported by anything under src/. See tests/test_no_key_leakage.py
#
# Built by reading all 10 knowledge base documents end to end. Section strings are
# the verbatim `##` header text with the leading "## " removed. Document names are
# file stems (no .md) — the emitted format is controlled by config, not by this file.
#
# confidence: high | medium | low
#   high   = the section header or its first line near-verbatim answers the question
#   medium = strong lean, one defensible alternative exists
#   low    = genuinely contested, resolve by probe
#
# kind: lookup | multi_doc | multi_section | adversarial | trap

